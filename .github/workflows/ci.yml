name: CI Web & Security Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-audit:
    name: Code Quality, Security & Schema Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Security & Secret Leak Scanning
        run: |
          echo "🔒 Scanning for sensitive credentials and tokens..."
          python3 -c "
          import os, re, sys
          SUSPICIOUS = [
              r'AKIA[0-9A-Z]{16}',
              r'ghp_[0-9a-zA-Z]{36}',
              r'-----BEGIN (?:RSA )?PRIVATE KEY-----'
          ]
          leaks = []
          for root, dirs, files in os.walk('.'):
              dirs[:] = [d for d in dirs if d not in {'.git', '.venv', '__pycache__'}]
              for file in files:
                  if file.endswith(('.png', '.webp', '.ico', '.woff2')):
                      continue
                  p = os.path.join(root, file)
                  with open(p, 'r', encoding='utf-8', errors='ignore') as f:
                      for i, line in enumerate(f, 1):
                          for pat in SUSPICIOUS:
                              if re.search(pat, line):
                                  leaks.append((p, i))
          if leaks:
              print('❌ Credentials detected in code:', leaks)
              sys.exit(1)
          print('✅ Zero secret leaks detected.')
          "

      - name: Validate HTML Markup & Semantic Structure
        run: |
          echo "🔍 Checking HTML markup validity..."
          python3 -c "
          import os, sys
          files = ['index.html', 'impressum.html', 'datenschutz.html']
          for f in files:
              if not os.path.exists(f):
                  print(f'❌ Missing {f}')
                  sys.exit(1)
              content = open(f, encoding='utf-8').read()
              assert '<!DOCTYPE html>' in content, f'Missing DOCTYPE in {f}'
              assert '<html lang=\"de\">' in content, f'Missing lang in {f}'
              assert '<meta name=\"viewport\"' in content, f'Missing viewport in {f}'
              assert 'skip-link' in content, f'Missing skip-link in {f}'
              print(f'✅ {f} verified.')
          "

      - name: Validate Schema.org JSON-LD Structured Data
        run: |
          echo "🔍 Validating Schema.org JSON-LD..."
          python3 -c "
          import json, re, sys
          html = open('index.html', encoding='utf-8').read()
          match = re.search(r'<script type=\"application/ld\+json\">(.*?)</script>', html, re.DOTALL)
          if not match:
              print('❌ Missing JSON-LD')
              sys.exit(1)
          data = json.loads(match.group(1))
          assert data['@context'] == 'https://schema.org'
          assert '@graph' in data or data.get('@type') == 'MedicalBusiness'
          types = [item['@type'] for item in data.get('@graph', [data])]
          assert 'MedicalBusiness' in types, 'Missing MedicalBusiness in Schema.org graph'
          assert 'FAQPage' in types, 'Missing FAQPage in Schema.org graph'
          print(f'✅ Valid Schema.org detected: {types}')
          "

      - name: Validate Internal Links & Anchor Integrity
        run: |
          echo "🔍 Validating all internal anchors and file references..."
          python3 -c "
          import re, os, sys
          html_files = ['index.html', 'impressum.html', 'datenschutz.html']
          for f in html_files:
              content = open(f, encoding='utf-8').read()
              ids = set(re.findall(r'id=[\"\x27]([a-zA-Z0-9_-]+)[\"\x27]', content))
              anchors = re.findall(r'href=[\"\x27]#([a-zA-Z0-9_-]+)[\"\x27]', content)
              for anchor in anchors:
                  assert anchor in ids, f'Broken anchor #{anchor} in {f}'
              
              links = re.findall(r'href=[\"\x27]([a-zA-Z0-9_.-]+\.html)[\"\x27]', content)
              for link in links:
                  assert os.path.exists(link), f'Broken file link {link} in {f}'
          print('✅ All internal links and section anchors are 100% valid.')
          "

      - name: Verify CSS Tokens & Performance Optimization
        run: |
          echo "🔍 Verifying CSS design tokens and content-visibility..."
          python3 -c "
          css = open('css/style.css', encoding='utf-8').read()
          assert ':root' in css and '--primary:' in css, 'Missing CSS design tokens'
          assert 'content-visibility: auto' in css, 'Missing content-visibility optimizations'
          assert '@media (prefers-reduced-motion: reduce)' in css, 'Missing a11y reduced motion query'
          print('✅ CSS tokens, a11y and performance rules verified.')
          "

      - name: Verify PWA, Sitemap, Service Worker & Favicon Assets
        run: |
          echo "🔍 Verifying PWA, SEO, Service Worker and asset files..."
          python3 -c "
          import os, json
          assert os.path.exists('sitemap.xml'), 'Missing sitemap.xml'
          assert os.path.exists('robots.txt'), 'Missing robots.txt'
          assert os.path.exists('manifest.json'), 'Missing manifest.json'
          assert os.path.exists('sw.js'), 'Missing sw.js'
          assert os.path.exists('assets/icons/favicon.svg'), 'Missing assets/icons/favicon.svg'
          manifest = json.load(open('manifest.json'))
          assert manifest.get('name') and manifest.get('theme_color')
          print('✅ PWA, SEO and vector assets verified.')
          "

      - name: Verify Deployment Pipeline Syntax
        run: |
          echo "🔍 Compiling scripts/deploy.py..."
          python3 -m py_compile scripts/deploy.py
          echo "✅ scripts/deploy.py compiled cleanly."
